<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Vědmák: Pogromca Leszych — Zápisník</title>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Crimson+Pro:ital,wght@0,300;0,400;0,600;1,400&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --blood:      #8a0303;
      --blood-dk:   #5a0202;
      --blood-lt:   #b52828;
      --silver:     #c0c0c0;
      --silver-dk:  #888;
      --dark:       #1a1a1a;
      --darker:     #0f0f0f;
      --parchment:  #221910;
      --parch-lt:   #2e2016;
      --parch-med:  #3a2e1e;
      --text:       #d4c5a9;
      --text-dim:   #8a7a65;
      --border:     rgba(138,3,3,.25);
      --border-sv:  rgba(192,192,192,.12);
    }

    body {
      background: var(--darker);
      min-height: 100vh;
      font-family: 'Crimson Pro', serif;
      color: var(--text);
    }

    /* ── Scrollbar ── */
    ::-webkit-scrollbar { width: 5px; }
    ::-webkit-scrollbar-track { background: var(--darker); }
    ::-webkit-scrollbar-thumb { background: var(--blood-dk); border-radius: 3px; }

    /* ── Layout ── */
    body {
      background:
        radial-gradient(ellipse 100% 40% at 50% 0%, #1a0404 0%, transparent 60%),
        #0f0f0f;
    }

    #root {
      max-width: 720px;
      margin: 0 auto;
      padding: 0 16px 60px;
    }

    /* ── Dashboard Header ── */
    .dash-header {
      display: flex; align-items: center; gap: 14px;
      padding: 18px 0 12px;
      border-bottom: 1px solid var(--border);
      margin-bottom: 14px;
    }
    .witcher-emblem {
      font-size: 40px;
      filter: drop-shadow(0 0 10px rgba(138,3,3,.7));
    }
    .dash-hero-info { flex: 1; }
    .witcher-name {
      font-family: 'Cinzel', serif;
      font-size: 22px; font-weight: 700;
      color: var(--silver);
      text-shadow: 0 0 14px rgba(192,192,192,.2);
    }
    .witcher-school {
      font-size: 13px; color: var(--text-dim);
      letter-spacing: .06em;
    }
    .dash-lang-row {
      display: flex; gap: 4px; align-items: center; flex-wrap: wrap;
    }
    .lang-btn {
      background: none; border: 1px solid rgba(138,3,3,.2);
      border-radius: 3px; padding: 2px 5px; font-size: 14px;
      cursor: pointer; opacity: .5; transition: all .15s;
    }
    .lang-btn:hover, .lang-btn.active { opacity: 1; border-color: var(--blood-lt); }
    .btn-logout {
      background: none; border: 1px solid rgba(138,3,3,.3);
      color: var(--text-dim); padding: 5px 12px; border-radius: 3px;
      font-family: 'Cinzel', serif; font-size: 10px; letter-spacing: .1em;
      text-transform: uppercase; cursor: pointer; transition: all .2s;
    }
    .btn-logout:hover { border-color: var(--blood-lt); color: var(--text); }

    /* ── Cards ── */
    .card {
      background: var(--parch-lt);
      border: 1px solid var(--border);
      border-radius: 3px;
      padding: 16px 18px;
      margin-bottom: 12px;
      position: relative;
    }
    .card::before {
      content: ""; position: absolute;
      inset: 0; border-radius: 3px;
      background: linear-gradient(135deg, rgba(138,3,3,.04) 0%, transparent 60%);
      pointer-events: none;
    }

    .section-label {
      font-family: 'Cinzel', serif; font-size: 11px;
      letter-spacing: .18em; text-transform: uppercase;
      color: var(--blood-lt); margin-bottom: 12px;
    }

    /* ── HP / XP bars ── */
    .stat-bars { display: flex; flex-direction: column; gap: 8px; margin-bottom: 14px; }
    .stat-row { display: flex; align-items: center; gap: 10px; }
    .stat-label { font-size: 12px; color: var(--text-dim); width: 100px; flex-shrink: 0; }
    .stat-value { font-size: 12px; color: var(--text-dim); width: 130px; text-align: right; flex-shrink: 0; }
    .bar-outer {
      flex: 1; height: 8px; background: rgba(0,0,0,.5);
      border-radius: 4px; overflow: hidden;
      border: 1px solid rgba(138,3,3,.15);
    }
    .bar-inner {
      height: 100%; border-radius: 4px;
      transition: width .4s ease;
    }
    .hp-bar-inner { background: linear-gradient(90deg, #5a0202, #b52828); }
    .xp-bar-inner { background: linear-gradient(90deg, #3a3a00, #a0900a); }

    /* ── Stats chips ── */
    .stats-grid {
      display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px;
    }
    .stat-chip {
      background: rgba(0,0,0,.35);
      border: 1px solid var(--border);
      border-radius: 3px; padding: 8px 6px;
      text-align: center; display: flex; flex-direction: column; gap: 2px;
    }
    .stat-chip strong { font-family: 'Cinzel', serif; font-size: 16px; color: var(--silver); }
    .stat-chip span   { font-size: 10px; color: var(--text-dim); letter-spacing: .06em; }

    /* ── Equipment ── */
    .equip-grid {
      display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px;
    }
    .equip-slot {
      background: rgba(0,0,0,.25); border: 1px solid var(--border-sv);
      border-radius: 3px; padding: 10px 12px;
      display: flex; align-items: center; gap: 10px;
    }
    .equip-icon { font-size: 20px; }
    .equip-label { font-size: 10px; color: var(--text-dim); display: block; letter-spacing: .08em; }
    .equip-name  { font-size: 13px; color: var(--text); }

    /* ── Nav Grid ── */
    .nav-grid {
      display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px;
      margin-bottom: 12px;
    }
    .nav-btn {
      background: var(--parch-lt);
      border: 1px solid var(--border);
      border-radius: 3px; padding: 14px 8px;
      color: var(--text); cursor: pointer;
      display: flex; flex-direction: column; align-items: center; gap: 6px;
      font-family: 'Crimson Pro', serif; font-size: 22px;
      transition: all .2s;
    }
    .nav-btn span {
      font-size: 10px; letter-spacing: .08em;
      text-transform: uppercase; color: var(--text-dim);
    }
    .nav-btn:hover {
      border-color: var(--blood-lt);
      background: var(--parch-med);
      box-shadow: 0 0 14px rgba(138,3,3,.2);
      transform: translateY(-1px);
    }
    .nav-btn:active { transform: translateY(0); }

    /* ── Audio ── */
    .audio-card {
      display: flex; align-items: center; gap: 14px;
      padding: 12px 18px;
    }
    .audio-label { font-size: 13px; color: var(--text-dim); white-space: nowrap; }
    audio { height: 30px; filter: sepia(.5) hue-rotate(-20deg); }

    /* ── Footer ── */
    .site-footer {
      text-align: center; margin-top: 32px;
      font-size: 12px; color: var(--text-dim);
      letter-spacing: .08em;
      border-top: 1px solid var(--border); padding-top: 16px;
    }

    /* ── Screen header ── */
    .screen-header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 16px 0 10px;
      border-bottom: 1px solid var(--border);
      margin-bottom: 14px;
    }
    .screen-header h2 {
      font-family: 'Cinzel', serif; font-size: 18px; font-weight: 600;
      color: var(--silver);
    }
    .btn-back {
      background: none; border: 1px solid var(--border);
      color: var(--text-dim); padding: 6px 14px; border-radius: 3px;
      font-family: 'Cinzel', serif; font-size: 11px; letter-spacing: .1em;
      cursor: pointer; transition: all .2s;
    }
    .btn-back:hover { border-color: var(--blood-lt); color: var(--text); }

    /* ── Buttons ── */
    .btn-primary {
      background: linear-gradient(135deg, #8a0303, #6a0202);
      color: var(--silver); border: none; border-radius: 3px;
      padding: 11px 24px; font-family: 'Cinzel', serif;
      font-size: 12px; font-weight: 600; letter-spacing: .12em;
      text-transform: uppercase; cursor: pointer;
      transition: all .2s; display: inline-block;
    }
    .btn-primary:hover { box-shadow: 0 4px 18px rgba(138,3,3,.45); transform: translateY(-1px); }
    .btn-primary:disabled { opacity: .45; cursor: not-allowed; transform: none; }

    .btn-buy, .btn-equip, .btn-equip-sign {
      background: rgba(138,3,3,.15); color: var(--text);
      border: 1px solid var(--border); border-radius: 3px;
      padding: 6px 14px; font-family: 'Cinzel', serif;
      font-size: 10px; letter-spacing: .1em; text-transform: uppercase;
      cursor: pointer; transition: all .15s;
    }
    .btn-buy:hover, .btn-equip:hover, .btn-equip-sign:hover {
      border-color: var(--blood-lt); background: rgba(138,3,3,.25);
    }
    .btn-buy:disabled { opacity: .4; cursor: not-allowed; }

    .btn-danger {
      background: linear-gradient(135deg, #7a0202, #550101);
      color: var(--silver); border: none; border-radius: 3px;
      padding: 11px 24px; font-family: 'Cinzel', serif;
      font-size: 12px; letter-spacing: .12em; text-transform: uppercase;
      cursor: pointer; transition: all .2s; display: inline-block;
      margin-top: 12px;
    }
    .btn-danger:hover { box-shadow: 0 4px 18px rgba(138,3,3,.5); }
    .btn-danger:disabled { opacity: .45; }

    /* ── Badges ── */
    .badge-equipped {
      background: rgba(0,80,0,.3); color: #80c880;
      border: 1px solid rgba(0,150,0,.3); border-radius: 2px;
      padding: 3px 10px; font-size: 10px; letter-spacing: .08em;
    }

    /* ── Select / styled ── */
    .styled-select {
      width: 100%; padding: 10px 14px;
      background: rgba(0,0,0,.4); color: var(--text);
      border: 1px solid var(--border); border-radius: 3px;
      font-family: 'Crimson Pro', serif; font-size: 15px;
    }
    .styled-select option { background: #1a1a1a; }
    .styled-select:focus { outline: none; border-color: var(--blood-lt); }

    .field-label {
      display: block; font-size: 11px; letter-spacing: .14em;
      text-transform: uppercase; color: var(--text-dim); margin-bottom: 8px;
    }

    /* ── Items / Beast grid ── */
    .item-grid {
      display: flex; flex-direction: column; gap: 8px;
    }
    .item-card {
      display: flex; align-items: center; gap: 12px;
      background: rgba(0,0,0,.25); border: 1px solid var(--border-sv);
      border-radius: 3px; padding: 10px 14px;
      transition: border-color .15s;
    }
    .item-card.equipped { border-color: rgba(0,150,0,.4); }
    .item-card:hover    { border-color: var(--border); }
    .item-icon { font-size: 24px; }
    .item-info { flex: 1; display: flex; flex-direction: column; gap: 2px; }
    .item-info strong { font-size: 15px; color: var(--text); }
    .item-stats { font-size: 12px; color: var(--text-dim); }
    .item-price { font-size: 12px; color: #a89050; }

    /* ── Beast cards ── */
    .beast-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }
    .beast-card {
      background: rgba(0,0,0,.25); border: 1px solid var(--border-sv);
      border-radius: 3px; padding: 10px; cursor: pointer;
      display: flex; flex-direction: column; align-items: center; gap: 4px;
      color: var(--text); font-family: 'Crimson Pro', serif;
      transition: all .15s;
    }
    .beast-card:hover, .beast-card.selected {
      border-color: var(--blood-lt); background: rgba(138,3,3,.1);
    }
    .beast-icon { font-size: 28px; }
    .beast-name { font-size: 14px; font-weight: 600; }
    .beast-stats { font-size: 11px; color: var(--text-dim); }
    .beast-reward { font-size: 11px; color: #a89050; }
    .beast-diff { color: var(--blood-lt); font-size: 11px; letter-spacing: 2px; }
    .diff-1 .beast-diff { color: #80c880; }
    .diff-2 .beast-diff { color: #c8a820; }
    .diff-3 .beast-diff { color: var(--blood-lt); }
    .diff-4 .beast-diff { color: #e04040; }

    /* ── Travel ── */
    .travel-card { text-align: center; }
    .travel-anim { font-size: 56px; margin-bottom: 12px; animation: sway 2s ease-in-out infinite; }
    @keyframes sway { 0%,100%{transform:rotate(-3deg)} 50%{transform:rotate(3deg)} }
    .travel-dest { font-size: 15px; color: var(--text-dim); margin-bottom: 8px; }
    .countdown-wrap { margin-top: 16px; }
    .countdown-bar-outer {
      height: 6px; background: rgba(0,0,0,.5); border-radius: 3px; overflow: hidden;
      border: 1px solid var(--border); margin-bottom: 8px;
    }
    .countdown-bar-inner {
      height: 100%; background: linear-gradient(90deg, var(--blood-dk), var(--blood-lt));
      border-radius: 3px; transition: width .2s linear;
    }
    .countdown-text { font-size: 13px; color: var(--text-dim); }
    .mount-info {
      font-size: 13px; color: var(--text-dim); margin-bottom: 14px;
    }

    /* ── Reward ── */
    .reward-card { text-align: center; }
    .reward-won { font-family: 'Cinzel', serif; font-size: 20px; color: #c8a820; margin-bottom: 16px; }
    .reward-lost { font-family: 'Cinzel', serif; font-size: 18px; color: var(--blood-lt); margin-bottom: 16px; }
    .reward-grid { display: flex; justify-content: center; gap: 20px; margin-bottom: 16px; }
    .reward-item { display: flex; flex-direction: column; align-items: center; gap: 4px; }
    .reward-item span { font-size: 22px; }
    .reward-item strong { font-size: 15px; color: var(--silver); }
    .axii-bonus { font-size: 11px; color: #c8a820; display: block; }

    /* ── Battle log ── */
    .battle-log {
      background: rgba(0,0,0,.3); border: 1px solid var(--border-sv);
      border-radius: 3px; padding: 10px 14px; margin-bottom: 14px; text-align: left;
    }
    .battle-log summary {
      font-size: 12px; letter-spacing: .08em; color: var(--text-dim);
      cursor: pointer; text-transform: uppercase;
    }
    .battle-log ul {
      list-style: none; margin-top: 10px;
      display: flex; flex-direction: column; gap: 4px;
    }
    .battle-log li { font-size: 13px; color: var(--text-dim); }

    /* ── Arena ── */
    .arena-stats-card {}
    .arena-fighter {
      display: flex; align-items: center; gap: 14px; margin-bottom: 8px;
    }
    .fighter-avatar { font-size: 40px; }
    .fighter-info { display: flex; flex-direction: column; gap: 2px; }
    .fighter-info strong { font-size: 16px; color: var(--silver); }
    .result-win  { border-color: rgba(0,150,0,.4) !important; }
    .result-loss { border-color: rgba(150,0,0,.4) !important; }
    .result-win h3  { color: #80c880; margin-bottom: 8px; }
    .result-loss h3 { color: var(--blood-lt); margin-bottom: 8px; }

    /* ── Oreny display ── */
    .oreny-display {
      font-family: 'Cinzel', serif; font-size: 16px; color: #c8a820;
    }

    /* ── HP bar ── */
    .hp-display { display: flex; align-items: center; gap: 12px; }
    .hp-bar-outer {
      flex: 1; height: 8px; background: rgba(0,0,0,.5); border-radius: 4px; overflow: hidden;
    }
    .hp-bar-inner { height: 100%; background: linear-gradient(90deg, #5a0202, #b52828); border-radius: 4px; }

    /* ── Mounts ── */
    .mounts-grid { display: flex; flex-direction: column; gap: 8px; }
    .mount-card {
      display: flex; align-items: center; gap: 14px;
      background: rgba(0,0,0,.2); border: 1px solid var(--border-sv);
      border-radius: 3px; padding: 12px 14px; transition: border-color .15s;
    }
    .mount-card.mount-active { border-color: rgba(0,100,0,.4); }
    .mount-icon { font-size: 28px; }
    .mount-info { flex: 1; display: flex; flex-direction: column; gap: 2px; }
    .mount-info strong { font-size: 15px; }

    /* ── Food / Tavern ── */
    .food-grid { display: flex; flex-direction: column; gap: 8px; }
    .food-card {
      display: flex; align-items: center; gap: 14px;
      background: rgba(0,0,0,.2); border: 1px solid var(--border-sv);
      border-radius: 3px; padding: 10px 14px;
    }
    .food-icon { font-size: 26px; }

    /* ── Leaderboard ── */
    .lb-card { padding: 0; overflow: hidden; }
    .lb-list { display: flex; flex-direction: column; }
    .lb-row {
      display: flex; align-items: center; gap: 10px;
      padding: 12px 16px;
      border-bottom: 1px solid var(--border-sv);
      transition: background .15s;
    }
    .lb-row:last-child { border-bottom: none; }
    .lb-row:hover { background: rgba(138,3,3,.05); }
    .lb-row-me { background: rgba(138,3,3,.08); }
    .lb-top3 { background: rgba(100,80,0,.06); }
    .lb-rank { width: 40px; text-align: center; flex-shrink: 0; }
    .lb-medal { font-size: 22px; }
    .lb-num { font-family: 'Cinzel', serif; font-size: 14px; color: var(--text-dim); }
    .lb-emblem { font-size: 22px; flex-shrink: 0; }
    .lb-main { flex: 1; min-width: 0; }
    .lb-name {
      font-size: 15px; color: var(--silver); font-weight: 600;
      display: flex; align-items: center; gap: 8px;
    }
    .lb-you {
      background: rgba(138,3,3,.3); color: var(--blood-lt);
      font-size: 9px; padding: 2px 6px; border-radius: 2px;
      letter-spacing: .1em; text-transform: uppercase;
    }
    .lb-school { font-size: 12px; color: var(--text-dim); margin-bottom: 4px; }
    .lb-xp-wrap { display: flex; align-items: center; gap: 8px; }
    .lb-xp-bar {
      flex: 1; height: 5px; background: rgba(0,0,0,.5); border-radius: 3px; overflow: hidden;
    }
    .lb-xp-fill { height: 100%; background: linear-gradient(90deg, #3a3a00, #a0900a); border-radius: 3px; }
    .lb-xp-text { font-size: 10px; color: var(--text-dim); white-space: nowrap; }
    .lb-stats { display: flex; flex-direction: column; gap: 3px; text-align: right; }
    .lb-level { font-family: 'Cinzel', serif; font-size: 15px; color: var(--blood-lt); }
    .lb-sub { font-size: 11px; color: var(--text-dim); }

    /* ── Chat ── */
    .chat-card { padding: 0; display: flex; flex-direction: column; }
    .chat-messages {
      height: 340px; overflow-y: auto;
      padding: 14px 16px;
      display: flex; flex-direction: column; gap: 10px;
    }
    .chat-input-row {
      display: flex; gap: 8px; padding: 12px 16px;
      border-top: 1px solid var(--border);
    }
    .chat-input {
      flex: 1; padding: 9px 14px;
      background: rgba(0,0,0,.4); color: var(--text);
      border: 1px solid var(--border); border-radius: 3px;
      font-family: 'Crimson Pro', serif; font-size: 15px;
    }
    .chat-input:focus { outline: none; border-color: var(--blood-lt); }
    .btn-send {
      background: linear-gradient(135deg, #8a0303, #6a0202);
      color: var(--silver); border: none; border-radius: 3px;
      padding: 9px 18px; font-family: 'Cinzel', serif;
      font-size: 11px; letter-spacing: .1em; text-transform: uppercase;
      cursor: pointer; transition: all .2s;
    }
    .btn-send:hover { box-shadow: 0 2px 12px rgba(138,3,3,.4); }
    .chat-msg { display: flex; flex-direction: column; max-width: 75%; }
    .chat-msg-me   { align-self: flex-end; align-items: flex-end; }
    .chat-msg-other{ align-self: flex-start; align-items: flex-start; }
    .chat-sender { font-size: 11px; color: var(--blood-lt); margin-bottom: 3px; letter-spacing: .06em; }
    .chat-bubble {
      padding: 8px 14px; border-radius: 3px;
      display: flex; align-items: baseline; gap: 10px;
    }
    .chat-msg-me .chat-bubble {
      background: rgba(138,3,3,.2); border: 1px solid rgba(138,3,3,.3);
    }
    .chat-msg-other .chat-bubble {
      background: rgba(0,0,0,.3); border: 1px solid var(--border-sv);
    }
    .chat-text { font-size: 14px; color: var(--text); }
    .chat-time { font-size: 10px; color: var(--text-dim); white-space: nowrap; }
    .chat-loading { font-size: 13px; color: var(--text-dim); padding: 16px 0; }

    /* ── Signs ── */
    .signs-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
    .sign-card {
      background: rgba(0,0,0,.25); border: 1px solid var(--border-sv);
      border-radius: 3px; padding: 14px;
      display: flex; flex-direction: column; align-items: center; gap: 6px; text-align: center;
      transition: border-color .15s;
    }
    .sign-card.sign-equipped { border-color: rgba(138,3,3,.5); background: rgba(138,3,3,.08); }
    .sign-card:hover { border-color: var(--border); }
    .sign-icon { font-size: 32px; }
    .sign-card strong { font-family: 'Cinzel', serif; font-size: 14px; color: var(--silver); }
    .sign-card .muted-text { font-size: 12px; }

    /* ── Loading ── */
    .loading-wrap {
      display: flex; flex-direction: column; align-items: center;
      padding: 48px 16px; gap: 14px;
    }
    .rune-spinner {
      width: 40px; height: 40px;
      border: 2px solid rgba(138,3,3,.2);
      border-top-color: var(--blood-lt);
      border-radius: 50%;
      animation: spin .8s linear infinite;
    }
    .loading-text {
      font-family: 'Cinzel', serif; font-size: 12px;
      letter-spacing: .2em; text-transform: uppercase; color: var(--text-dim);
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── Misc ── */
    .muted-text  { font-size: 13px; color: var(--text-dim); }
    .error-text  { color: #f08080; font-size: 14px; }

    .spinner-inline {
      display: inline-block; width: 12px; height: 12px;
      border: 2px solid rgba(192,192,192,.3); border-top-color: var(--silver);
      border-radius: 50%; animation: spin .6s linear infinite;
      vertical-align: middle; margin-right: 8px;

    /* ── Responsive ── */
    @media (max-width: 480px) {

      .signs-grid  { grid-template-columns: 1fr; }
